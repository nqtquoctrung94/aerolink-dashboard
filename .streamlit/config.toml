[theme]
base = "light"
primaryColor = "#2a52be"
backgroundColor = "#f5f6f8"
secondaryBackgroundColor = "#ffffff"
textColor = "#333333"
font = "sans serif"

[server]
headless = false   # opens your browser on `streamlit run`
address = "localhost"   # only this computer can open the dashboard
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
